<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 340 340" role="img" aria-label="Animated avatar: cybersecurity engineer working on a laptop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D91"/>
      <stop offset="1" stop-color="#1F6FEB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="170" cy="170" r="160"/></clipPath>
    <style>
      .float1{animation:f 4s ease-in-out infinite}
      .float2{animation:f 5s ease-in-out infinite .8s}
      .float3{animation:f 4.5s ease-in-out infinite 1.6s}
      .float4{animation:f 5.5s ease-in-out infinite 2.2s}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      .blink{animation:b 5s infinite;transform-origin:170px 128px}
      @keyframes b{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      .pulse{animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:.9}}
      .ring{animation:r 18s linear infinite;transform-origin:170px 170px}
      @keyframes r{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <!-- background -->
  <circle cx="170" cy="170" r="160" fill="url(#bg)"/>
  <circle class="ring" cx="170" cy="170" r="150" fill="none" stroke="#9CC9FF" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 14"/>

  <g clip-path="url(#circle)">
    <!-- binary rain (subtle) -->
    <g font-family="Fira Code,Consolas,monospace" font-size="11" fill="#9CC9FF" opacity=".18">
      <text x="40" y="70">1010</text><text x="250" y="60">0110</text>
      <text x="30" y="210">0011</text><text x="262" y="200">1101</text>
    </g>

    <!-- hair (back) -->
    <path d="M118 120 C112 70 228 70 222 120 L230 205 C215 215 125 215 110 205 Z" fill="#2B1B17"/>

    <!-- body / hoodie -->
    <path d="M92 300 C95 230 130 205 170 205 C210 205 245 230 248 300 Z" fill="#161B22"/>
    <path d="M150 207 L170 232 L190 207" fill="none" stroke="#30363D" stroke-width="4" stroke-linecap="round"/>
    <!-- neck -->
    <rect x="158" y="176" width="24" height="32" rx="10" fill="#D49A78"/>

    <!-- head -->
    <ellipse cx="170" cy="132" rx="44" ry="50" fill="#E0AC8A"/>
    <!-- bangs -->
    <path d="M126 125 C124 88 150 76 172 78 C200 80 220 96 214 128 C200 108 178 100 150 104 C140 108 132 116 126 125 Z" fill="#2B1B17"/>

    <!-- glasses -->
    <g fill="none" stroke="#0D1117" stroke-width="3">
      <rect x="138" y="122" width="26" height="18" rx="7"/>
      <rect x="176" y="122" width="26" height="18" rx="7"/>
      <path d="M164 130 L176 130"/>
    </g>
    <!-- eyes -->
    <g class="blink" fill="#0D1117">
      <circle cx="151" cy="131" r="3.4"/>
      <circle cx="189" cy="131" r="3.4"/>
    </g>
    <!-- smile -->
    <path d="M158 156 Q170 165 182 156" fill="none" stroke="#9C4A3A" stroke-width="3" stroke-linecap="round"/>

    <!-- laptop -->
    <ellipse class="pulse" cx="170" cy="255" rx="95" ry="40" fill="url(#glow)"/>
    <path d="M100 230 L240 230 L232 292 L108 292 Z" fill="#C9D1D9"/>
    <path d="M100 230 L240 230 L232 292 L108 292 Z" fill="none" stroke="#8B949E" stroke-width="2"/>
    <rect x="80" y="290" width="180" height="12" rx="5" fill="#8B949E"/>
    <!-- shield logo on laptop -->
    <path class="pulse" d="M170 244 L186 250 C186 266 180 276 170 281 C160 276 154 266 154 250 Z" fill="#1F6FEB"/>
    <path d="M163 262 L168 267 L178 256" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating icons -->
  <!-- lock -->
  <g class="float1">
    <circle cx="62" cy="112" r="24" fill="#FFFFFF"/>
    <rect x="51" y="110" width="22" height="16" rx="3" fill="#1F6FEB"/>
    <path d="M55 110 V104 a7 7 0 0 1 14 0 V110" fill="none" stroke="#1F6FEB" stroke-width="3"/>
    <circle cx="62" cy="118" r="2.5" fill="#FFFFFF"/>
  </g>
  <!-- code -->
  <g class="float2">
    <circle cx="282" cy="108" r="24" fill="#FFFFFF"/>
    <text x="282" y="114" text-anchor="middle" font-family="Fira Code,Consolas,monospace" font-weight="700" font-size="16" fill="#0B3D91">&lt;/&gt;</text>
  </g>
  <!-- network nodes -->
  <g class="float3">
    <circle cx="52" cy="222" r="22" fill="#FFFFFF"/>
    <g stroke="#2EA043" stroke-width="2.5"><path d="M44 228 L52 214 L60 228 Z" fill="none"/></g>
    <circle cx="52" cy="214" r="4" fill="#2EA043"/><circle cx="44" cy="228" r="4" fill="#2EA043"/><circle cx="60" cy="228" r="4" fill="#2EA043"/>
  </g>
  <!-- check / audit -->
  <g class="float4">
    <circle cx="290" cy="220" r="22" fill="#FFFFFF"/>
    <rect x="280" y="208" width="20" height="24" rx="3" fill="none" stroke="#FB8C00" stroke-width="2.5"/>
    <path d="M284 217 h12 M284 223 h12 M284 229 h7" stroke="#FB8C00" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
